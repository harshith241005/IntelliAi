services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
    volumes:
      - ./backend:/app
    command: python run_backend.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/cameras"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  pipeline:
    build: ./backend
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      API_ENDPOINT: http://backend:8000/events/ingest
    volumes:
      - ./backend:/app
    # Note: Requires a volume mounted video file or access to webcam device which Docker struggles with on Mac/Windows natively without special flags.
    command: python runner.py --source 0 --api http://backend:8000/events/ingest
      VIDEO_SOURCE: "0"
      CROWD_THRESHOLD: "20"
    depends_on:
      backend:
        condition: service_healthy
    # Webcam inside Docker needs device mapping on Linux:
    # devices: ["/dev/video0:/dev/video0"]

volumes:
  mongo_data:
