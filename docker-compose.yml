services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
    volumes:
      - ./backend:/app
      - ./resources:/app/resources
    command: python run_backend.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/cameras"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  pipeline:
    build: ./backend
    profiles: ["ai"]
    restart: unless-stopped
    environment:
      API_ENDPOINT: http://backend:5000/api/events/ingest
      VIDEO_SOURCE: "0"
      CROWD_THRESHOLD: "20"
    volumes:
      - ./backend:/app
      - ./resources:/app/resources
    # Headless execution configuration
    command: python runner.py --source "/app/resources/CAM 1.mp4" --api http://backend:5000/api/events/ingest --display false
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
